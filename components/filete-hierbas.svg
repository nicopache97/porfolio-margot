  <circle cx="155" cy="15" r="2" fill="currentColor" fill-opacity="0.4" />
  <circle cx="20" cy="30" r="1.5" fill="currentColor" />
  <circle cx="180" cy="30" r="1.5" fill="currentColor" />
  <circle cx="100" cy="5" r="2" fill="currentColor" />
